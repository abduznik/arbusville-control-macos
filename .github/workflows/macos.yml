name: macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal .app
        run: |
          set -euo pipefail
          APP="build/Arbusville Control.app"
          rm -rf build dist icon.iconset
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" dist

          clang -fobjc-arc -O2 -Wall \
            -arch arm64 -arch x86_64 \
            -mmacosx-version-min=11.0 \
            -framework Cocoa -framework WebKit \
            src/DashApp.m -o "$APP/Contents/MacOS/ArbusvilleControl"

          cp packaging/Info.plist "$APP/Contents/Info.plist"

          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/dashd.png --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d assets/dashd.png --out "icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/AppIcon.icns"

          codesign --force --deep --sign - "$APP"
          lipo -info "$APP/Contents/MacOS/ArbusvilleControl"

          echo "== plist checks =="
          plutil -p "$APP/Contents/Info.plist" | grep -E "NSAllowsArbitraryLoads|NSMicrophoneUsageDescription|CFBundleShortVersionString" || true
          plutil -lint "$APP/Contents/Info.plist"

          hdiutil create -volname "Arbusville Control" -srcfolder "$APP" \
            -ov -format UDZO "dist/ArbusvilleControl-macos.dmg"
          shasum -a 256 dist/*.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ArbusvilleControl-dmg
          path: dist/*.dmg
